# Configuration File for XAI-QoS Framework
# config/xai_qos_config.yaml

# Device configuration
device: 'cpu'  # or 'cuda' for GPU

# Traffic Classifier Configuration
classifier:
  input_dim: 50
  hidden_dim: 128
  n_heads: 8
  n_layers: 3
  n_classes: 3
  dropout: 0.1
  model_path: 'models/xai_qos_classifier.pth'  # ← Add this!
  class_names:  # ← From your training output
    - 'background'
    - 'ftp'
    - 'http_browsing'

# XAI Explainer Configuration  
explainer:
  importance_threshold: 0.05
  top_k_features: 5
  explanation_method: 'attention_weights'

# Policy Translator Configuration
policy_translator:
  enable_dynamic_adjustment: true
  congestion_threshold: 0.8
  policy_update_interval: 10  # seconds

# SDN Controller Configuration
sdn_controller:
  monitoring_interval: 5  # seconds
  flow_timeout: 300      # seconds
  controller_port: 6633
  openflow_version: '1.3'

# QoS Policies Configuration
qos_policies:
  enable_preemption: true
  max_queues: 8
  default_queue: 3
  
  # Queue definitions
  queues:
    1:  # Critical
      max_rate: 100000  # Kbps
      min_rate: 50000   # Kbps
      priority: 7
    2:  # High
      max_rate: 50000
      min_rate: 20000
      priority: 6
    3:  # Normal
      max_rate: 20000
      min_rate: 5000
      priority: 4
    4:  # Low
      max_rate: 10000
      min_rate: 1000
      priority: 2
    5:  # Background
      max_rate: 5000
      min_rate: 500
      priority: 1

# Logging Configuration
logging:
  level: 'INFO'
  log_file: 'xai_qos.log'
  max_file_size: '10MB'
  backup_count: 5